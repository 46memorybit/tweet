```html
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>100×100 ブロック文字 Generator</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 30px;
        font-family: sans-serif;
        background: #eeeeee;
        color: #222;
    }

    .container {
        max-width: 1000px;
        margin: 0 auto;
    }

    h1 {
        font-size: 24px;
        margin-bottom: 20px;
    }

    textarea {
        width: 100%;
        height: 120px;
        padding: 12px;
        font-size: 20px;
        resize: vertical;
        border: 1px solid #ccc;
        border-radius: 6px;
    }

    button {
        margin-top: 12px;
        margin-right: 6px;
        padding: 10px 20px;
        border: none;
        border-radius: 6px;
        background: #323639;
        color: #fff;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        opacity: 0.85;
    }

    #preview {
        margin-top: 30px;
        padding: 30px;
        overflow-x: auto;

        /* 透過部分確認用 */
        background:
            linear-gradient(45deg, #ddd 25%, transparent 25%),
            linear-gradient(-45deg, #ddd 25%, transparent 25%),
            linear-gradient(45deg, transparent 75%, #ddd 75%),
            linear-gradient(-45deg, transparent 75%, #ddd 75%);

        background-size: 20px 20px;

        background-position:
            0 0,
            0 10px,
            10px -10px,
            -10px 0;

        border-radius: 8px;
    }

    #preview svg {
        display: block;
        width: 100%;
        height: auto;
    }
</style>

</head>

<body>

<div class="container">

    <h1>100×100 ブロック文字 Generator</h1>

    <textarea
        id="textInput"
        placeholder="文字を入力してください"
    ></textarea>

    <br>

    <button onclick="generateSVG()">
        生成
    </button>

    <button onclick="downloadSVG()">
        SVGをダウンロード
    </button>

    <button onclick="downloadPNG()">
        透過PNGをダウンロード
    </button>

    <div id="preview"></div>

</div>


<script>

/* =========================================
   設定
========================================= */

/*
 * 1文字を100×100に分割
 *
 * 100 × 100
 * = 10,000ブロック
 */
const GRID_SIZE = 100;


/*
 * 1文字のサイズ
 *
 * 100px × 100px
 *
 * したがって
 *
 * 1ブロック = 1px × 1px
 */
const FONT_SIZE = 100;


/*
 * 文字同士の間隔
 */
const LETTER_SPACING = 10;


/*
 * 使用する3色
 */
const COLORS = [
    "#323639",
    "#cfd9de",
    "#ffffff"
];


/*
 * 現在のSVG
 */
let currentSVG = null;


/* =========================================
   1文字を100×100ブロックに変換
========================================= */

function createCharacter(char, x, y) {

    /*
     * 文字判定用Canvas
     */
    const canvas =
        document.createElement("canvas");

    const ctx =
        canvas.getContext("2d");


    canvas.width =
        FONT_SIZE;

    canvas.height =
        FONT_SIZE;


    /*
     * 背景は透明
     */
    ctx.clearRect(
        0,
        0,
        FONT_SIZE,
        FONT_SIZE
    );


    /*
     * 文字描画
     *
     * 100×100の領域いっぱいを使用
     */
    ctx.font =
        `bold ${FONT_SIZE}px sans-serif`;

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.fillStyle =
        "#000000";


    ctx.fillText(
        char,
        FONT_SIZE / 2,
        FONT_SIZE / 2
    );


    /*
     * Canvasのピクセル情報を取得
     */
    const imageData =
        ctx.getImageData(
            0,
            0,
            FONT_SIZE,
            FONT_SIZE
        );


    const data =
        imageData.data;


    /*
     * SVGのブロック
     */
    let blocks = "";


    /*
     * 100 × 100
     *
     * = 10,000ブロック
     */
    for (
        let row = 0;
        row < GRID_SIZE;
        row++
    ) {

        for (
            let col = 0;
            col < GRID_SIZE;
            col++
        ) {

            /*
             * このブロックの中央ピクセル
             *
             * 1ブロック = 1px
             */
            const px = col;

            const py = row;


            /*
             * RGBA配列の位置
             */
            const index =
                (py * FONT_SIZE + px) * 4;


            /*
             * Alpha値
             */
            const alpha =
                data[index + 3];


            /*
             * 文字部分の場合だけ着色
             */
            if (alpha > 30) {

                /*
                 * 3色からランダム選択
                 */
                const color =
                    COLORS[
                        Math.floor(
                            Math.random() *
                            COLORS.length
                        )
                    ];


                /*
                 * 1×1pxのブロック
                 */
                blocks +=
                    `<rect
                        x="${x + col}"
                        y="${y + row}"
                        width="1"
                        height="1"
                        fill="${color}"
                    />`;
            }
        }
    }


    return blocks;
}


/* =========================================
   SVG生成
========================================= */

function generateSVG() {

    const text =
        document.getElementById(
            "textInput"
        ).value;


    if (!text) {

        alert(
            "文字を入力してください。"
        );

        return;
    }


    /*
     * 改行を除去
     */
    const chars =
        [...text].filter(
            char => char !== "\n"
        );


    /*
     * SVG全体の幅
     */
    const width =
        chars.length *
        (FONT_SIZE + LETTER_SPACING);


    /*
     * SVG全体の高さ
     */
    const height =
        FONT_SIZE;


    let content = "";


    /*
     * すべての文字を処理
     */
    chars.forEach(
        (char, index) => {

            const x =
                index *
                (FONT_SIZE + LETTER_SPACING);


            const y = 0;


            content +=
                createCharacter(
                    char,
                    x,
                    y
                );
        }
    );


    /*
     * 背景なしSVG
     *
     * backgroundや背景rectを
     * 一切入れないため完全透過
     */
    currentSVG = `
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="${width}"
    height="${height}"
    viewBox="0 0 ${width} ${height}"
>
${content}
</svg>
`.trim();


    /*
     * プレビュー
     */
    document.getElementById(
        "preview"
    ).innerHTML =
        currentSVG;
}


/* =========================================
   SVGダウンロード
========================================= */

function downloadSVG() {

    /*
     * 未生成なら生成
     */
    if (!currentSVG) {

        generateSVG();

        if (!currentSVG) {
            return;
        }
    }


    const blob =
        new Blob(
            [currentSVG],
            {
                type:
                    "image/svg+xml;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    a.href =
        url;

    a.download =
        "block-text.svg";


    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);


    URL.revokeObjectURL(url);
}


/* =========================================
   透過PNGダウンロード
========================================= */

function downloadPNG() {

    /*
     * 未生成なら生成
     */
    if (!currentSVG) {

        generateSVG();

        if (!currentSVG) {
            return;
        }
    }


    /*
     * SVGをBlob化
     */
    const svgBlob =
        new Blob(
            [currentSVG],
            {
                type:
                    "image/svg+xml;charset=utf-8"
            }
        );


    /*
     * SVGのURL
     */
    const svgURL =
        URL.createObjectURL(
            svgBlob
        );


    /*
     * SVGを画像として読み込む
     */
    const img =
        new Image();


    img.onload =
        function () {

            /*
             * PNG用Canvas
             */
            const canvas =
                document.createElement(
                    "canvas"
                );


            canvas.width =
                img.naturalWidth;

            canvas.height =
                img.naturalHeight;


            const ctx =
                canvas.getContext(
                    "2d"
                );


            /*
             * Canvasは初期状態が透明。
             *
             * 背景を描画しない。
             */
            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            /*
             * SVGをCanvasへ描画
             */
            ctx.drawImage(
                img,
                0,
                0
            );


            /*
             * PNG化
             */
            canvas.toBlob(
                function (blob) {

                    if (!blob) {

                        alert(
                            "PNGの生成に失敗しました。"
                        );

                        return;
                    }


                    /*
                     * PNG URL
                     */
                    const pngURL =
                        URL.createObjectURL(
                            blob
                        );


                    /*
                     * ダウンロード
                     */
                    const a =
                        document.createElement(
                            "a"
                        );


                    a.href =
                        pngURL;

                    a.download =
                        "block-text.png";


                    document.body.appendChild(
                        a
                    );

                    a.click();

                    document.body.removeChild(
                        a
                    );


                    /*
                     * URL解放
                     */
                    URL.revokeObjectURL(
                        pngURL
                    );

                },
                "image/png"
            );


            /*
             * SVG URL解放
             */
            URL.revokeObjectURL(
                svgURL
            );
        };


    img.onerror =
        function () {

            URL.revokeObjectURL(
                svgURL
            );

            alert(
                "PNGへの変換に失敗しました。"
            );
        };


    /*
     * SVGを読み込む
     */
    img.src =
        svgURL;
}

</script>

</body>
</html>
