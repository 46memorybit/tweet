<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100×100 ブロック文字 Generator</title>
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    padding: 30px;
    font-family: sans-serif;
    background: #eeeeee;
    color: #222;
}
.container {
    max-width: 1200px;
    margin: 0 auto;
}
h1 {
    font-size: 24px;
    margin-bottom: 10px;
}
.description {
    margin-bottom: 20px;
    line-height: 1.7;
}
textarea {
    width: 100%;
    height: 120px;
    padding: 12px;
    font-size: 20px;
    resize: vertical;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #fff;
}
.controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 12px;
}
button {
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    background: #323639;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
}
button:hover {
    opacity: 0.85;
}
#preview {
    margin-top: 30px;
    padding: 30px;
    overflow-x: auto;
    border-radius: 8px;
    background:
        linear-gradient(45deg, #ddd 25%, transparent 25%),
        linear-gradient(-45deg, #ddd 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #ddd 75%),
        linear-gradient(-45deg, transparent 75%, #ddd 75%);
    background-size: 20px 20px;
    background-position:
        0 0,
        0 10px,
        10px -10px,
        -10px 0;
}
#preview svg {
    display: block;
    width: 100%;
    height: auto;
}
.stats {
    margin-top: 15px;
    padding: 12px 16px;
    background: #fff;
    border-radius: 6px;
    line-height: 1.7;
}
.legend {
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
    margin-top: 20px;
}
.legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
}
.color-box {
    width: 28px;
    height: 28px;
    border: 1px solid #aaa;
}
</style>
</head>
<body>
<div class="container">
    <h1>100×100 ブロック文字 Generator</h1>
    <div class="description">
        1文字を100×100＝10,000ブロックに分割します。<br>
        文字部分・背景部分を問わず、全ブロックに #323639 / #cfd9de / #ffffff / #000000 の4色をランダムで割り当て、<br>
        各ブロックを独立に50%の確率で透明化します。<br>
        改行も反映されます。
    </div>
    <textarea
        id="textInput"
        placeholder="文字を入力してください（改行可）"
    ></textarea>
    <div class="controls">
        <button onclick="generateSVG()">
            生成
        </button>
        <button onclick="downloadPNG()">
            透過PNGをダウンロード
        </button>
        <button onclick="downloadSVG()">
            透過SVGをダウンロード
        </button>
    </div>
    <div id="preview"></div>
    <div id="stats" class="stats" style="display:none;"></div>
    <div class="legend">
        <div class="legend-item">
            <div
                class="color-box"
                style="background:#323639;"
            ></div>
            <span>#323639</span>
        </div>
        <div class="legend-item">
            <div
                class="color-box"
                style="background:#cfd9de;"
            ></div>
            <span>#cfd9de</span>
        </div>
        <div class="legend-item">
            <div
                class="color-box"
                style="background:#ffffff;"
            ></div>
            <span>#ffffff</span>
        </div>
        <div class="legend-item">
            <div
                class="color-box"
                style="background:#000000;"
            ></div>
            <span>#000000</span>
        </div>
    </div>
</div>
<script>
/* =========================================
   設定
========================================= */
/*
 * 1文字のグリッドサイズ
 * 100 × 100 = 10,000ブロック
 */
const GRID_SIZE = 100;
/*
 * 1文字のサイズ
 * 100px × 100px
 * 1ブロック = 1px × 1px
 */
const FONT_SIZE = 100;
/*
 * 文字同士の間隔（横）
 */
const LETTER_SPACING = 10;
/*
 * 行同士の間隔（縦）
 */
const LINE_SPACING = 20;
/*
 * 全ブロックにランダムで割り当てる4色
 */
const COLORS = [
    "#323639",
    "#cfd9de",
    "#ffffff",
    "#000000"
];
/*
 * 透明化確率（固定50%）
 */
const TRANSPARENCY_RATE = 0.5;
/*
 * 現在生成されているSVG
 */
let currentSVG = null;
/* =========================================
   ランダムな色を取得
========================================= */
function getRandomColor() {
    return COLORS[
        Math.floor(
            Math.random() * COLORS.length
        )
    ];
}
/* =========================================
   1文字を処理
========================================= */
function createCharacter(char, x, y) {
    /*
     * 文字判定用Canvas（現在は形状判定に未使用だが、
     * 将来の拡張のために残しています）
     * 今回は文字・背景を区別せず全ブロックを同様に処理
     */
    const canvas =
        document.createElement("canvas");
    const ctx =
        canvas.getContext("2d");
    canvas.width =
        FONT_SIZE;
    canvas.height =
        FONT_SIZE;
    ctx.clearRect(
        0,
        0,
        FONT_SIZE,
        FONT_SIZE
    );
    ctx.font =
        `bold ${FONT_SIZE}px sans-serif`;
    ctx.textAlign =
        "center";
    ctx.textBaseline =
        "middle";
    ctx.fillStyle =
        "#000000";
    ctx.fillText(
        char,
        FONT_SIZE / 2,
        FONT_SIZE / 2
    );
    /*
     * SVGコンテンツ
     */
    let svgContent = "";
    /*
     * 全ブロック（文字部分・背景部分問わず）を走査
     */
    for (
        let row = 0;
        row < GRID_SIZE;
        row++
    ) {
        for (
            let col = 0;
            col < GRID_SIZE;
            col++
        ) {
            /*
             * 4色をランダム割り当て
             */
            const assignedColor =
                getRandomColor();
            /*
             * 50%の確率で透明化
             * （残りの50%だけ描画）
             */
            if (
                Math.random() >=
                TRANSPARENCY_RATE
            ) {
                svgContent +=
                    `<rect
                        x="${x + col}"
                        y="${y + row}"
                        width="1"
                        height="1"
                        fill="${assignedColor}"
                    />`;
            }
        }
    }
    return svgContent;
}
/* =========================================
   SVG生成
========================================= */
function generateSVG() {
    /*
     * 入力文字を取得
     */
    const text =
        document.getElementById(
            "textInput"
        ).value;
    if (!text || text.trim() === "") {
        alert(
            "文字を入力してください。"
        );
        return;
    }
    /*
     * 改行で分割して行配列を作成
     */
    const lines = text
        .replace(/\r\n/g, "\n")
        .replace(/\r/g, "\n")
        .split("\n");
    /*
     * 各行の文字配列を作成（空行は空配列）
     */
    const lineChars = lines.map(
        line => [...line]
    );
    /*
     * 有効な文字が1つもない場合
     */
    const hasAnyChar = lineChars.some(
        chars => chars.length > 0
    );
    if (!hasAnyChar) {
        alert(
            "文字を入力してください。"
        );
        return;
    }
    /*
     * 最長行の文字数を取得
     */
    const maxCharsInLine = Math.max(
        ...lineChars.map(
            chars => chars.length
        )
    );
    /*
     * SVG全体の幅
     * （最長行の文字数に基づく）
     */
    const width =
        maxCharsInLine > 0
            ? maxCharsInLine *
              (FONT_SIZE + LETTER_SPACING) -
              LETTER_SPACING
            : FONT_SIZE;
    /*
     * SVG全体の高さ
     * （行数に基づく）
     */
    const height =
        lineChars.length *
            (FONT_SIZE + LINE_SPACING) -
        LINE_SPACING;
    /*
     * SVG内部
     */
    let content = "";
    /*
     * 全行・全文字を処理
     */
    lineChars.forEach(
        (chars, lineIndex) => {
            const y =
                lineIndex *
                (FONT_SIZE + LINE_SPACING);
            chars.forEach(
                (char, charIndex) => {
                    const x =
                        charIndex *
                        (FONT_SIZE + LETTER_SPACING);
                    content +=
                        createCharacter(
                            char,
                            x,
                            y
                        );
                }
            );
        }
    );
    /*
     * SVG生成
     * 描画されていない部分は完全透明
     */
    currentSVG = `
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="${width}"
    height="${height}"
    viewBox="0 0 ${width} ${height}"
>
${content}
</svg>
`.trim();
    /*
     * プレビュー表示
     */
    document.getElementById(
        "preview"
    ).innerHTML =
        currentSVG;
    /*
     * 統計表示
     */
    const stats =
        document.getElementById(
            "stats"
        );
    stats.style.display =
        "block";
    stats.innerHTML =
        `
        透明化率：
        <strong>
            ${(TRANSPARENCY_RATE * 100).toFixed(0)}%
        </strong>
        （固定）
        <br>
        文字部分・背景部分を問わず、全ブロックに4色をランダム割り当て後、<br>
        独立に50%の確率で透明化しています。
        <br>
        行数：
        <strong>
            ${lineChars.length}
        </strong>
        ／ 最長行の文字数：
        <strong>
            ${maxCharsInLine}
        </strong>
        `;
}
/* =========================================
   SVGダウンロード
========================================= */
function downloadSVG() {
    if (!currentSVG) {
        generateSVG();
        if (!currentSVG) {
            return;
        }
    }
    const blob =
        new Blob(
            [currentSVG],
            {
                type:
                    "image/svg+xml;charset=utf-8"
            }
        );
    const url =
        URL.createObjectURL(
            blob
        );
    const a =
        document.createElement(
            "a"
        );
    a.href =
        url;
    a.download =
        "block-text.svg";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(
        url
    );
}
/* =========================================
   透過PNGダウンロード
========================================= */
function downloadPNG() {
    if (!currentSVG) {
        generateSVG();
        if (!currentSVG) {
            return;
        }
    }
    const svgBlob =
        new Blob(
            [currentSVG],
            {
                type:
                    "image/svg+xml;charset=utf-8"
            }
        );
    const svgURL =
        URL.createObjectURL(
            svgBlob
        );
    const img =
        new Image();
    img.onload =
        function () {
            const canvas =
                document.createElement(
                    "canvas"
                );
            canvas.width =
                img.naturalWidth;
            canvas.height =
                img.naturalHeight;
            const ctx =
                canvas.getContext(
                    "2d"
                );
            /*
             * 背景を描画しない
             * → PNGも透明部分を保持
             */
            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );
            ctx.drawImage(
                img,
                0,
                0
            );
            canvas.toBlob(
                function (blob) {
                    if (!blob) {
                        alert(
                            "PNGの生成に失敗しました。"
                        );
                        return;
                    }
                    const pngURL =
                        URL.createObjectURL(
                            blob
                        );
                    const a =
                        document.createElement(
                            "a"
                        );
                    a.href =
                        pngURL;
                    a.download =
                        "block-text.png";
                    document.body.appendChild(
                        a
                    );
                    a.click();
                    document.body.removeChild(
                        a
                    );
                    URL.revokeObjectURL(
                        pngURL
                    );
                },
                "image/png"
            );
            URL.revokeObjectURL(
                svgURL
            );
        };
    img.onerror =
        function () {
            URL.revokeObjectURL(
                svgURL
            );
            alert(
                "PNGへの変換に失敗しました。"
            );
        };
    img.src =
        svgURL;
}
/* =========================================
   Ctrl + Enterで生成
========================================= */
document
    .getElementById("textInput")
    .addEventListener(
        "keydown",
        function(event) {
            if (
                event.ctrlKey &&
                event.key === "Enter"
            ) {
                generateSVG();
            }
        }
    );
</script>
</body>
</html>
