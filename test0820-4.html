<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>100×100 ブロック文字 Generator</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px;
    font-family: sans-serif;
    background: #eeeeee;
    color: #222;
}

.container {
    max-width: 1000px;
    margin: 0 auto;
}

h1 {
    font-size: 24px;
    margin-bottom: 20px;
}

textarea {
    width: 100%;
    height: 120px;
    padding: 12px;
    font-size: 20px;
    resize: vertical;
    border: 1px solid #ccc;
    border-radius: 6px;
}

button {
    margin-top: 12px;
    margin-right: 6px;
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    background: #323639;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    opacity: 0.85;
}


/*
 * プレビュー
 *
 * 透過部分が分かるように
 * チェッカーボードを表示
 */
#preview {
    margin-top: 30px;
    padding: 30px;
    overflow-x: auto;

    background:
        linear-gradient(45deg, #ddd 25%, transparent 25%),
        linear-gradient(-45deg, #ddd 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #ddd 75%),
        linear-gradient(-45deg, transparent 75%, #ddd 75%);

    background-size: 20px 20px;

    background-position:
        0 0,
        0 10px,
        10px -10px,
        -10px 0;

    border-radius: 8px;
}

#preview svg {
    display: block;
    width: 100%;
    height: auto;
}

</style>

</head>

<body>

<div class="container">

    <h1>100×100 ブロック文字 Generator</h1>

    <textarea
        id="textInput"
        placeholder="文字を入力してください"
    ></textarea>

    <br>

    <button onclick="generateSVG()">
        生成
    </button>

    <button onclick="downloadSVG()">
        SVGをダウンロード
    </button>

    <button onclick="downloadPNG()">
        透過PNGをダウンロード
    </button>

    <div id="preview"></div>

</div>


<script>


/* =========================================
   設定
========================================= */


/*
 * 1文字を100×100に分割
 *
 * 100 × 100
 * = 10,000ブロック
 */
const GRID_SIZE = 100;


/*
 * 1文字のサイズ
 *
 * 100px × 100px
 *
 * 1ブロック = 1px × 1px
 */
const FONT_SIZE = 100;


/*
 * 文字同士の間隔
 */
const LETTER_SPACING = 10;


/*
 * 文字部分に使用する色
 */
const TEXT_COLORS = [
    "#323639",
    "#cfd9de",
    "#ffffff"
];


/*
 * 背景を黒にする確率
 *
 * 0.5 = 50%
 */
const BACKGROUND_BLACK_PROBABILITY = 0.5;


/*
 * 現在のSVG
 */
let currentSVG = null;



/* =========================================
   1文字を100×100ブロックに変換
========================================= */

function createCharacter(char, x, y) {

    /*
     * 文字判定用Canvas
     */
    const canvas =
        document.createElement("canvas");

    const ctx =
        canvas.getContext("2d");


    canvas.width =
        FONT_SIZE;

    canvas.height =
        FONT_SIZE;


    /*
     * 完全透明
     */
    ctx.clearRect(
        0,
        0,
        FONT_SIZE,
        FONT_SIZE
    );


    /*
     * 文字描画
     */
    ctx.font =
        `bold ${FONT_SIZE}px sans-serif`;

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.fillStyle =
        "#000000";


    ctx.fillText(
        char,
        FONT_SIZE / 2,
        FONT_SIZE / 2
    );


    /*
     * Canvasのピクセル情報
     */
    const imageData =
        ctx.getImageData(
            0,
            0,
            FONT_SIZE,
            FONT_SIZE
        );


    const data =
        imageData.data;


    /*
     * SVGブロック
     */
    let blocks = "";


    /*
     * 100 × 100
     *
     * = 10,000ブロック
     */
    for (
        let row = 0;
        row < GRID_SIZE;
        row++
    ) {

        for (
            let col = 0;
            col < GRID_SIZE;
            col++
        ) {

            /*
             * 1ブロック = 1px
             */
            const px = col;
            const py = row;


            /*
             * RGBA配列の位置
             */
            const index =
                (py * FONT_SIZE + px) * 4;


            /*
             * 文字部分かどうか
             */
            const alpha =
                data[index + 3];


            /* =================================
               文字部分
            ================================= */

            if (alpha > 30) {

                /*
                 * 文字部分は3色からランダム
                 */
                const color =
                    TEXT_COLORS[
                        Math.floor(
                            Math.random() *
                            TEXT_COLORS.length
                        )
                    ];


                blocks +=
                    `<rect
                        x="${x + col}"
                        y="${y + row}"
                        width="1"
                        height="1"
                        fill="${color}"
                    />`;

            }


            /* =================================
               背景部分
            ================================= */

            else {

                /*
                 * 50%の確率で黒
                 *
                 * Math.random() < 0.5
                 */
                if (
                    Math.random() <
                    BACKGROUND_BLACK_PROBABILITY
                ) {

                    blocks +=
                        `<rect
                            x="${x + col}"
                            y="${y + row}"
                            width="1"
                            height="1"
                            fill="#000000"
                        />`;

                }

                /*
                 * それ以外は何も描画しない
                 *
                 * → 完全透過
                 */
            }
        }
    }


    return blocks;
}



/* =========================================
   SVG生成
========================================= */

function generateSVG() {

    const text =
        document.getElementById(
            "textInput"
        ).value;


    if (!text) {

        alert(
            "文字を入力してください。"
        );

        return;
    }


    /*
     * 改行を除去
     */
    const chars =
        [...text].filter(
            char => char !== "\n"
        );


    /*
     * SVG全体の幅
     */
    const width =
        chars.length *
        (FONT_SIZE + LETTER_SPACING);


    /*
     * SVG全体の高さ
     */
    const height =
        FONT_SIZE;


    let content = "";


    /*
     * 全文字を処理
     */
    chars.forEach(
        (char, index) => {

            const x =
                index *
                (FONT_SIZE + LETTER_SPACING);


            const y = 0;


            content +=
                createCharacter(
                    char,
                    x,
                    y
                );
        }
    );


    /*
     * 背景なしSVG
     *
     * 描画されなかった部分は
     * 完全透過
     */
    currentSVG = `
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="${width}"
    height="${height}"
    viewBox="0 0 ${width} ${height}"
>
${content}
</svg>
`.trim();


    /*
     * プレビュー表示
     */
    document.getElementById(
        "preview"
    ).innerHTML =
        currentSVG;
}



/* =========================================
   SVGダウンロード
========================================= */

function downloadSVG() {

    /*
     * 未生成なら生成
     */
    if (!currentSVG) {

        generateSVG();

        if (!currentSVG) {
            return;
        }
    }


    const blob =
        new Blob(
            [currentSVG],
            {
                type:
                    "image/svg+xml;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    a.href =
        url;

    a.download =
        "block-text.svg";


    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);


    URL.revokeObjectURL(url);
}



/* =========================================
   透過PNGダウンロード
========================================= */

function downloadPNG() {

    /*
     * 未生成なら生成
     */
    if (!currentSVG) {

        generateSVG();

        if (!currentSVG) {
            return;
        }
    }


    /*
     * SVGをBlob化
     */
    const svgBlob =
        new Blob(
            [currentSVG],
            {
                type:
                    "image/svg+xml;charset=utf-8"
            }
        );


    /*
     * SVG URL
     */
    const svgURL =
        URL.createObjectURL(
            svgBlob
        );


    /*
     * Imageとして読み込む
     */
    const img =
        new Image();


    img.onload =
        function () {

            /*
             * PNG用Canvas
             */
            const canvas =
                document.createElement(
                    "canvas"
                );


            canvas.width =
                img.naturalWidth;

            canvas.height =
                img.naturalHeight;


            const ctx =
                canvas.getContext(
                    "2d"
                );


            /*
             * 背景を描画しない
             *
             * → 完全透過
             */
            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            /*
             * SVGを描画
             */
            ctx.drawImage(
                img,
                0,
                0
            );


            /*
             * PNGとして出力
             */
            canvas.toBlob(
                function (blob) {

                    if (!blob) {

                        alert(
                            "PNGの生成に失敗しました。"
                        );

                        return;
                    }


                    /*
                     * PNG URL
                     */
                    const pngURL =
                        URL.createObjectURL(
                            blob
                        );


                    /*
                     * ダウンロード
                     */
                    const a =
                        document.createElement(
                            "a"
                        );


                    a.href =
                        pngURL;

                    a.download =
                        "block-text.png";


                    document.body.appendChild(
                        a
                    );

                    a.click();

                    document.body.removeChild(
                        a
                    );


                    /*
                     * URL解放
                     */
                    URL.revokeObjectURL(
                        pngURL
                    );

                },
                "image/png"
            );


            URL.revokeObjectURL(
                svgURL
            );
        };


    img.onerror =
        function () {

            URL.revokeObjectURL(
                svgURL
            );

            alert(
                "PNGへの変換に失敗しました。"
            );
        };


    /*
     * SVG読み込み
     */
    img.src =
        svgURL;
}


</script>

</body>
</html>
