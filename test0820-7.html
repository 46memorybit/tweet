<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>100×100 ブロック文字 Generator</title>


<style>

/* =========================================
   基本
========================================= */

* {
    box-sizing: border-box;
}


body {
    margin: 0;
    padding: 30px;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: #eeeeee;
    color: #222;
}


.container {
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
}


/* =========================================
   タイトル
========================================= */

h1 {
    margin: 0 0 20px;

    font-size: 24px;
    font-weight: 700;
}


/* =========================================
   入力
========================================= */

textarea {

    display: block;

    width: 100%;
    height: 120px;

    padding: 12px;

    font-size: 20px;
    line-height: 1.5;

    resize: vertical;

    border: 1px solid #ccc;
    border-radius: 6px;

    background: #ffffff;
    color: #222;

    outline: none;
}


textarea:focus {
    border-color: #323639;
}


/* =========================================
   ボタン
========================================= */

button {

    margin-top: 12px;
    margin-right: 6px;

    padding: 10px 20px;

    border: none;
    border-radius: 6px;

    background: #323639;
    color: #ffffff;

    font-size: 16px;

    cursor: pointer;
}


button:hover {
    opacity: 0.85;
}


button:active {
    transform: translateY(1px);
}


/* =========================================
   プレビュー
========================================= */

#preview {

    margin-top: 30px;
    padding: 30px;

    overflow-x: auto;

    /*
     * 透明部分確認用チェッカーボード
     *
     * これはプレビュー部分だけの背景。
     * ダウンロードされるSVG / PNGには入りません。
     */
    background:
        linear-gradient(
            45deg,
            #ddd 25%,
            transparent 25%
        ),
        linear-gradient(
            -45deg,
            #ddd 25%,
            transparent 25%
        ),
        linear-gradient(
            45deg,
            transparent 75%,
            #ddd 75%
        ),
        linear-gradient(
            -45deg,
            transparent 75%,
            #ddd 75%
        );

    background-size: 20px 20px;

    background-position:
        0 0,
        0 10px,
        10px -10px,
        -10px 0;

    border-radius: 8px;
}


/*
 * SVGの表示
 */

#preview svg {

    display: block;

    width: 100%;
    height: auto;
}


/* =========================================
   情報表示
========================================= */

.info {

    margin-top: 15px;

    font-size: 13px;
    line-height: 1.7;

    color: #666;
}

</style>

</head>


<body>


<div class="container">


<h1>
100×100 ブロック文字 Generator
</h1>


<textarea
    id="textInput"
    placeholder="文字を入力してください"
></textarea>


<br>


<button onclick="generateSVG()">
生成
</button>


<button onclick="downloadSVG()">
SVGをダウンロード
</button>


<button onclick="downloadPNG()">
透過PNGをダウンロード
</button>


<div class="info">

1文字 = 100×100 = 10,000ブロック<br>

文字：
#323639 / #cfd9de / #ffffff / 透明

<br>

背景：
#ffffff / 透明 / #000000

</div>


<div id="preview"></div>


</div>



<script>


/* =========================================
   設定
========================================= */


/*
 * 1文字のグリッドサイズ
 *
 * 100 × 100
 * = 10,000ブロック
 */
const GRID_SIZE = 100;


/*
 * 1文字のサイズ
 *
 * 100px × 100px
 *
 * したがって
 *
 * 1ブロック = 1px × 1px
 */
const FONT_SIZE = 100;


/*
 * 文字同士の間隔
 */
const LETTER_SPACING = 10;


/* =========================================
   文字部分の色
========================================= */


/*
 * 文字の形として認識されたブロックは
 *
 * 以下の4種類からランダムに選択
 *
 * #323639
 * #cfd9de
 * #ffffff
 * 透明
 *
 * null = 透明
 */
const TEXT_COLORS = [

    "#323639",

    "#cfd9de",

    "#ffffff",

    null

];


/* =========================================
   背景部分の色
========================================= */


/*
 * 文字の外側のブロックは
 *
 * 以下の3種類からランダムに選択
 *
 * #ffffff
 * 透明
 * #000000
 *
 * null = 透明
 */
const BACKGROUND_COLORS = [

    "#ffffff",

    null,

    "#000000"

];


/*
 * 現在生成されているSVG
 */
let currentSVG = null;



/* =========================================
   ランダムな配列要素を取得
========================================= */

function randomChoice(array) {

    return array[
        Math.floor(
            Math.random() * array.length
        )
    ];

}



/* =========================================
   1文字を100×100ブロックに変換
========================================= */

function createCharacter(char, x, y) {


    /* -------------------------------------
       文字判定用Canvas
    ------------------------------------- */

    const canvas =
        document.createElement("canvas");


    const ctx =
        canvas.getContext("2d");


    /*
     * 100 × 100
     */
    canvas.width =
        FONT_SIZE;

    canvas.height =
        FONT_SIZE;


    /*
     * Canvasを完全透明にする
     */
    ctx.clearRect(
        0,
        0,
        FONT_SIZE,
        FONT_SIZE
    );


    /* -------------------------------------
       文字を描画
    ------------------------------------- */

    ctx.font =
        `bold ${FONT_SIZE}px sans-serif`;


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.fillStyle =
        "#000000";


    /*
     * 文字を100×100の中央に描画
     */
    ctx.fillText(

        char,

        FONT_SIZE / 2,

        FONT_SIZE / 2

    );


    /* -------------------------------------
       ピクセル情報取得
    ------------------------------------- */

    const imageData =
        ctx.getImageData(

            0,
            0,

            FONT_SIZE,
            FONT_SIZE

        );


    const data =
        imageData.data;


    /*
     * SVGブロック格納用
     */
    let blocks = "";


    /* =====================================
       100 × 100
       = 10,000ブロック
    ===================================== */

    for (
        let row = 0;
        row < GRID_SIZE;
        row++
    ) {


        for (
            let col = 0;
            col < GRID_SIZE;
            col++
        ) {


            /* --------------------------------
               現在のブロックの座標
            -------------------------------- */

            const px = col;
            const py = row;


            /*
             * RGBA配列上の位置
             */
            const index =
                (py * FONT_SIZE + px) * 4;


            /*
             * Alpha値
             *
             * 0   = 透明
             * 255 = 完全不透明
             */
            const alpha =
                data[index + 3];


            /* =================================
               文字部分
            ================================= */

            if (alpha > 30) {


                /*
                 * 文字部分は4択
                 *
                 * #323639
                 * #cfd9de
                 * #ffffff
                 * 透明
                 */
                const color =
                    randomChoice(
                        TEXT_COLORS
                    );


                /*
                 * 透明の場合は
                 * rectを生成しない
                 */
                if (color !== null) {


                    blocks +=
                        `<rect
                            x="${x + col}"
                            y="${y + row}"
                            width="1"
                            height="1"
                            fill="${color}"
                        />`;


                }


            }


            /* =================================
               背景部分
            ================================= */

            else {


                /*
                 * 背景部分は3択
                 *
                 * #ffffff
                 * 透明
                 * #000000
                 */
                const color =
                    randomChoice(
                        BACKGROUND_COLORS
                    );


                /*
                 * 透明の場合は
                 * rectを生成しない
                 */
                if (color !== null) {


                    blocks +=
                        `<rect
                            x="${x + col}"
                            y="${y + row}"
                            width="1"
                            height="1"
                            fill="${color}"
                        />`;


                }

            }

        }

    }


    return blocks;

}



/* =========================================
   SVG生成
========================================= */

function generateSVG() {


    /*
     * 入力文字取得
     */
    const text =
        document.getElementById(
            "textInput"
        ).value;


    /*
     * 空文字チェック
     */
    if (!text) {


        alert(
            "文字を入力してください。"
        );


        return;

    }


    /*
     * 改行を除外
     */
    const chars =
        [...text].filter(

            char =>
                char !== "\n" &&
                char !== "\r"

        );


    /*
     * 文字がない場合
     */
    if (chars.length === 0) {


        alert(
            "文字を入力してください。"
        );


        return;

    }


    /* -------------------------------------
       SVGサイズ
    ------------------------------------- */

    /*
     * 1文字 = 100px
     *
     * 文字間 = 10px
     */
    const width =
        chars.length *
        (FONT_SIZE + LETTER_SPACING);


    const height =
        FONT_SIZE;


    /*
     * SVG内部
     */
    let content = "";


    /* -------------------------------------
       全文字を処理
    ------------------------------------- */

    chars.forEach(

        (char, index) => {


            /*
             * X座標
             */
            const x =
                index *
                (FONT_SIZE + LETTER_SPACING);


            /*
             * Y座標
             */
            const y = 0;


            /*
             * 10,000ブロック生成
             */
            content +=
                createCharacter(

                    char,

                    x,

                    y

                );

        }

    );


    /* =====================================
       SVG本体
    ===================================== */

    /*
     * 背景要素は一切入れない。
     *
     * rectが存在しない部分は
     * 完全透明になる。
     */
    currentSVG = `

<svg
    xmlns="http://www.w3.org/2000/svg"

    width="${width}"

    height="${height}"

    viewBox="0 0 ${width} ${height}"

    shape-rendering="crispEdges"
>

${content}

</svg>

`.trim();


    /* -------------------------------------
       プレビュー表示
    ------------------------------------- */

    document.getElementById(
        "preview"
    ).innerHTML =
        currentSVG;

}



/* =========================================
   SVGダウンロード
========================================= */

function downloadSVG() {


    /*
     * 未生成の場合は生成
     */
    if (!currentSVG) {


        generateSVG();


        if (!currentSVG) {
            return;
        }

    }


    /*
     * SVG Blob
     */
    const blob =
        new Blob(

            [currentSVG],

            {
                type:
                    "image/svg+xml;charset=utf-8"
            }

        );


    /*
     * ダウンロードURL
     */
    const url =
        URL.createObjectURL(
            blob
        );


    /*
     * ダウンロードリンク
     */
    const a =
        document.createElement(
            "a"
        );


    a.href =
        url;


    a.download =
        "block-text.svg";


    document.body.appendChild(
        a
    );


    a.click();


    document.body.removeChild(
        a
    );


    /*
     * URL解放
     */
    URL.revokeObjectURL(
        url
    );

}



/* =========================================
   透過PNGダウンロード
========================================= */

function downloadPNG() {


    /*
     * SVGがまだ生成されていなければ
     * 自動生成
     */
    if (!currentSVG) {


        generateSVG();


        if (!currentSVG) {
            return;
        }

    }


    /* -------------------------------------
       SVG Blob
    ------------------------------------- */

    const svgBlob =
        new Blob(

            [currentSVG],

            {
                type:
                    "image/svg+xml;charset=utf-8"
            }

        );


    /*
     * SVG URL
     */
    const svgURL =
        URL.createObjectURL(
            svgBlob
        );


    /*
     * Image作成
     */
    const img =
        new Image();


    /* =====================================
       SVG読み込み完了
    ===================================== */

    img.onload =
        function () {


            /* --------------------------------
               PNG用Canvas
            -------------------------------- */

            const canvas =
                document.createElement(
                    "canvas"
                );


            /*
             * SVGと同じサイズ
             */
            canvas.width =
                img.naturalWidth;


            canvas.height =
                img.naturalHeight;


            /*
             * Canvas Context
             */
            const ctx =
                canvas.getContext(
                    "2d"
                );


            /*
             * 背景を描画しない。
             *
             * Canvasの初期状態が透明なので、
             * SVGの透明部分もPNGで透明になる。
             */
            ctx.clearRect(

                0,
                0,

                canvas.width,
                canvas.height

            );


            /*
             * SVGをCanvasへ描画
             */
            ctx.drawImage(

                img,

                0,
                0

            );


            /* --------------------------------
               PNG生成
            -------------------------------- */

            canvas.toBlob(

                function (blob) {


                    if (!blob) {


                        alert(
                            "PNGの生成に失敗しました。"
                        );


                        URL.revokeObjectURL(
                            svgURL
                        );


                        return;

                    }


                    /*
                     * PNG URL
                     */
                    const pngURL =
                        URL.createObjectURL(
                            blob
                        );


                    /*
                     * ダウンロードリンク
                     */
                    const a =
                        document.createElement(
                            "a"
                        );


                    a.href =
                        pngURL;


                    a.download =
                        "block-text.png";


                    document.body.appendChild(
                        a
                    );


                    a.click();


                    document.body.removeChild(
                        a
                    );


                    /*
                     * URL解放
                     */
                    URL.revokeObjectURL(
                        pngURL
                    );


                },

                "image/png"

            );


            /*
             * SVG URL解放
             */
            URL.revokeObjectURL(
                svgURL
            );

        };


    /* =====================================
       SVG読み込み失敗
    ===================================== */

    img.onerror =
        function () {


            URL.revokeObjectURL(
                svgURL
            );


            alert(
                "PNGへの変換に失敗しました。"
            );

        };


    /*
     * SVGをImageとして読み込む
     */
    img.src =
        svgURL;

}


</script>


</body>

</html>
