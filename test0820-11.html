<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100×100 ブロック文字 Generator</title>
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    padding: 30px;
    font-family: sans-serif;
    background: #eeeeee;
    color: #222;
}
.container {
    max-width: 1200px;
    margin: 0 auto;
}
h1 {
    font-size: 24px;
    margin-bottom: 10px;
}
.description {
    margin-bottom: 20px;
    line-height: 1.7;
}
textarea {
    width: 100%;
    height: 120px;
    padding: 12px;
    font-size: 20px;
    resize: vertical;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #fff;
}
.controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 12px;
}
button {
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    background: #323639;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
}
button:hover {
    opacity: 0.85;
}
#preview {
    margin-top: 30px;
    padding: 30px;
    overflow-x: auto;
    border-radius: 8px;
    background:
        linear-gradient(45deg, #ddd 25%, transparent 25%),
        linear-gradient(-45deg, #ddd 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #ddd 75%),
        linear-gradient(-45deg, transparent 75%, #ddd 75%);
    background-size: 20px 20px;
    background-position:
        0 0,
        0 10px,
        10px -10px,
        -10px 0;
}
#preview svg {
    display: block;
    width: 100%;
    height: auto;
}
.stats {
    margin-top: 15px;
    padding: 12px 16px;
    background: #fff;
    border-radius: 6px;
    line-height: 1.7;
}
.legend {
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
    margin-top: 20px;
}
.legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
}
.color-box {
    width: 28px;
    height: 28px;
    border: 1px solid #aaa;
}
</style>
</head>
<body>
<div class="container">
    <h1>100×100 ブロック文字 Generator</h1>
    <div class="description">
        1文字を100×100＝10,000ブロックに分割します。<br>
        全ブロックに4色をランダムで割り当て、文字部分では#000000以外を透明化します。<br>
        その後、文字部分で透明化された実際の割合を計算し、
        背景部分も同じ確率で透明化します。<br>
        改行も反映されます。
    </div>
    <textarea
        id="textInput"
        placeholder="文字を入力してください（改行可）"
    ></textarea>
    <div class="controls">
        <button onclick="generateSVG()">
            生成
        </button>
        <button onclick="downloadPNG()">
            透過PNGをダウンロード
        </button>
        <button onclick="downloadSVG()">
            透過SVGをダウンロード
        </button>
    </div>
    <div id="preview"></div>
    <div id="stats" class="stats" style="display:none;"></div>
    <div class="legend">
        <div class="legend-item">
            <div
                class="color-box"
                style="background:#323639;"
            ></div>
            <span>#323639</span>
        </div>
        <div class="legend-item">
            <div
                class="color-box"
                style="background:#cfd9de;"
            ></div>
            <span>#cfd9de</span>
        </div>
        <div class="legend-item">
            <div
                class="color-box"
                style="background:#ffffff;"
            ></div>
            <span>#ffffff</span>
        </div>
        <div class="legend-item">
            <div
                class="color-box"
                style="background:#000000;"
            ></div>
            <span>#000000</span>
        </div>
    </div>
</div>
<script>
/* =========================================
   設定
========================================= */
/*
 * 1文字のグリッドサイズ
 *
 * 100 × 100
 * = 10,000ブロック
 */
const GRID_SIZE = 100;
/*
 * 1文字のサイズ
 *
 * 100px × 100px
 *
 * 1ブロック = 1px × 1px
 */
const FONT_SIZE = 100;
/*
 * 文字同士の間隔（横）
 */
const LETTER_SPACING = 10;
/*
 * 行同士の間隔（縦）
 */
const LINE_SPACING = 20;
/*
 * 全ブロックにランダムで割り当てる4色
 */
const COLORS = [
    "#323639",
    "#cfd9de",
    "#ffffff",
    "#000000"
];
/*
 * 現在生成されているSVG
 */
let currentSVG = null;
/*
 * 透明化率
 *
 * 文字部分の処理によって
 * 動的に決定する
 */
let transparencyRate = 0;
/* =========================================
   ランダムな色を取得
========================================= */
function getRandomColor() {
    return COLORS[
        Math.floor(
            Math.random() * COLORS.length
        )
    ];
}
/* =========================================
   1文字を処理
========================================= */
function createCharacter(char, x, y) {
    /*
     * 文字判定用Canvas
     */
    const canvas =
        document.createElement("canvas");
    const ctx =
        canvas.getContext("2d");
    canvas.width =
        FONT_SIZE;
    canvas.height =
        FONT_SIZE;
    /*
     * Canvasを完全透明にする
     */
    ctx.clearRect(
        0,
        0,
        FONT_SIZE,
        FONT_SIZE
    );
    /*
     * 文字を描画
     */
    ctx.font =
        `bold ${FONT_SIZE}px sans-serif`;
    ctx.textAlign =
        "center";
    ctx.textBaseline =
        "middle";
    ctx.fillStyle =
        "#000000";
    ctx.fillText(
        char,
        FONT_SIZE / 2,
        FONT_SIZE / 2
    );
    /*
     * 文字のピクセル情報を取得
     */
    const imageData =
        ctx.getImageData(
            0,
            0,
            FONT_SIZE,
            FONT_SIZE
        );
    const data =
        imageData.data;
    /*
     * 文字部分のブロック数
     */
    let textBlockCount = 0;
    /*
     * 文字部分で透明になったブロック数
     *
     * #000000以外が割り当てられたブロック
     */
    let textTransparentCount = 0;
    /*
     * 背景部分のブロック情報を一時保存
     *
     * 透明化率が文字部分から確定してから
     * 背景を処理するため。
     */
    const backgroundBlocks = [];
    /*
     * 文字部分のSVG
     */
    let textSVG = "";
    /*
     * =========================================
     * 第1段階
     *
     * 全ブロックに4色を割り当て、
     * 文字部分の透明化率を計算する
     * =========================================
     */
    for (
        let row = 0;
        row < GRID_SIZE;
        row++
    ) {
        for (
            let col = 0;
            col < GRID_SIZE;
            col++
        ) {
            /*
             * 1ブロック = 1px
             */
            const px = col;
            const py = row;
            /*
             * RGBA配列の位置
             */
            const index =
                (py * FONT_SIZE + px) * 4;
            /*
             * 文字の透明度
             */
            const alpha =
                data[index + 3];
            /*
             * 全ブロックに4色をランダム割り当て
             */
            const assignedColor =
                getRandomColor();
            /*
             * 文字部分
             */
            if (alpha > 30) {
                textBlockCount++;
                /*
                 * #000000以外なら透明
                 */
                if (
                    assignedColor !== "#000000"
                ) {
                    textTransparentCount++;
                }
                /*
                 * #000000なら表示
                 */
                else {
                    textSVG +=
                        `<rect
                            x="${x + col}"
                            y="${y + row}"
                            width="1"
                            height="1"
                            fill="#000000"
                        />`;
                }
            }
            /*
             * 背景部分
             */
            else {
                backgroundBlocks.push({
                    col: col,
                    row: row,
                    color: assignedColor
                });
            }
        }
    }
    /*
     * =========================================
     * 文字部分の実際の透明化率を計算
     * =========================================
     *
     * 例：
     *
     * 文字ブロックが1000個
     * そのうち750個が#000000以外
     *
     * transparencyRate = 0.75
     *
     * → 背景も75%の確率で透明化
     */
    if (textBlockCount > 0) {
        transparencyRate =
            textTransparentCount /
            textBlockCount;
    }
    else {
        transparencyRate = 0;
    }
    /*
     * =========================================
     * 第2段階
     *
     * 背景ブロックを処理
     *
     * 文字部分と同じ透明化率を使用
     * =========================================
     */
    let backgroundSVG = "";
    backgroundBlocks.forEach(
        block => {
            /*
             * 文字部分と同じ確率で
             * 背景ブロックを透明化
             */
            const makeTransparent =
                Math.random() <
                transparencyRate;
            /*
             * 透明化しない場合
             * → 割り当てられた4色をそのまま表示
             */
            if (!makeTransparent) {
                backgroundSVG +=
                    `<rect
                        x="${x + block.col}"
                        y="${y + block.row}"
                        width="1"
                        height="1"
                        fill="${block.color}"
                    />`;
            }
            /*
             * 透明化する場合
             * → 何も描画しない
             */
        }
    );
    /*
     * 文字部分 + 背景部分
     */
    return (
        backgroundSVG +
        textSVG
    );
}
/* =========================================
   SVG生成
========================================= */
function generateSVG() {
    /*
     * 入力文字を取得
     */
    const text =
        document.getElementById(
            "textInput"
        ).value;
    if (!text || text.trim() === "") {
        alert(
            "文字を入力してください。"
        );
        return;
    }
    /*
     * 改行で分割して行配列を作成
     * （末尾の空行は無視、途中の空行は保持）
     */
    const lines = text
        .replace(/\r\n/g, "\n")
        .replace(/\r/g, "\n")
        .split("\n");
    /*
     * 各行の文字配列を作成（空行は空配列）
     */
    const lineChars = lines.map(
        line => [...line]
    );
    /*
     * 有効な文字が1つもない場合
     */
    const hasAnyChar = lineChars.some(
        chars => chars.length > 0
    );
    if (!hasAnyChar) {
        alert(
            "文字を入力してください。"
        );
        return;
    }
    /*
     * 最長行の文字数を取得
     */
    const maxCharsInLine = Math.max(
        ...lineChars.map(
            chars => chars.length
        )
    );
    /*
     * SVG全体の幅
     * （最長行の文字数に基づく）
     */
    const width =
        maxCharsInLine > 0
            ? maxCharsInLine *
              (FONT_SIZE + LETTER_SPACING) -
              LETTER_SPACING
            : FONT_SIZE;
    /*
     * SVG全体の高さ
     * （行数に基づく）
     */
    const height =
        lineChars.length *
            (FONT_SIZE + LINE_SPACING) -
        LINE_SPACING;
    /*
     * SVG内部
     */
    let content = "";
    /*
     * 全行・全文字を処理
     */
    lineChars.forEach(
        (chars, lineIndex) => {
            const y =
                lineIndex *
                (FONT_SIZE + LINE_SPACING);
            chars.forEach(
                (char, charIndex) => {
                    const x =
                        charIndex *
                        (FONT_SIZE + LETTER_SPACING);
                    content +=
                        createCharacter(
                            char,
                            x,
                            y
                        );
                }
            );
        }
    );
    /*
     * SVG生成
     *
     * 背景要素は配置しないため、
     * 描画されていない部分は完全透明。
     */
    currentSVG = `
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="${width}"
    height="${height}"
    viewBox="0 0 ${width} ${height}"
>
${content}
</svg>
`.trim();
    /*
     * プレビュー表示
     */
    document.getElementById(
        "preview"
    ).innerHTML =
        currentSVG;
    /*
     * 透明化率表示
     * （最後に処理した文字の透明化率を表示）
     */
    const stats =
        document.getElementById(
            "stats"
        );
    stats.style.display =
        "block";
    stats.innerHTML =
        `
        文字ブロックの透明化率：
        <strong>
            ${(transparencyRate * 100).toFixed(2)}%
        </strong>
        <br>
        背景ブロックも同じ
        <strong>
            ${(transparencyRate * 100).toFixed(2)}%
        </strong>
        の確率で透明化しています。
        <br>
        行数：
        <strong>
            ${lineChars.length}
        </strong>
        ／ 最長行の文字数：
        <strong>
            ${maxCharsInLine}
        </strong>
        `;
}
/* =========================================
   SVGダウンロード
========================================= */
function downloadSVG() {
    /*
     * 未生成なら生成
     */
    if (!currentSVG) {
        generateSVG();
        if (!currentSVG) {
            return;
        }
    }
    /*
     * SVG Blob
     */
    const blob =
        new Blob(
            [currentSVG],
            {
                type:
                    "image/svg+xml;charset=utf-8"
            }
        );
    /*
     * Blob URL
     */
    const url =
        URL.createObjectURL(
            blob
        );
    /*
     * ダウンロードリンク
     */
    const a =
        document.createElement(
            "a"
        );
    a.href =
        url;
    a.download =
        "block-text.svg";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    /*
     * URL解放
     */
    URL.revokeObjectURL(
        url
    );
}
/* =========================================
   透過PNGダウンロード
========================================= */
function downloadPNG() {
    /*
     * 未生成なら生成
     */
    if (!currentSVG) {
        generateSVG();
        if (!currentSVG) {
            return;
        }
    }
    /*
     * SVGをBlob化
     */
    const svgBlob =
        new Blob(
            [currentSVG],
            {
                type:
                    "image/svg+xml;charset=utf-8"
            }
        );
    /*
     * SVG Blob URL
     */
    const svgURL =
        URL.createObjectURL(
            svgBlob
        );
    /*
     * SVGをImageとして読み込む
     */
    const img =
        new Image();
    img.onload =
        function () {
            /*
             * PNG用Canvas
             */
            const canvas =
                document.createElement(
                    "canvas"
                );
            /*
             * SVGと同じサイズ
             */
            canvas.width =
                img.naturalWidth;
            canvas.height =
                img.naturalHeight;
            /*
             * 2Dコンテキスト
             */
            const ctx =
                canvas.getContext(
                    "2d"
                );
            /*
             * 背景を描画しない
             *
             * → PNGも透明部分を保持
             */
            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );
            /*
             * SVGをCanvasへ描画
             */
            ctx.drawImage(
                img,
                0,
                0
            );
            /*
             * PNGへ変換
             */
            canvas.toBlob(
                function (blob) {
                    if (!blob) {
                        alert(
                            "PNGの生成に失敗しました。"
                        );
                        return;
                    }
                    /*
                     * PNG Blob URL
                     */
                    const pngURL =
                        URL.createObjectURL(
                            blob
                        );
                    /*
                     * ダウンロード
                     */
                    const a =
                        document.createElement(
                            "a"
                        );
                    a.href =
                        pngURL;
                    a.download =
                        "block-text.png";
                    document.body.appendChild(
                        a
                    );
                    a.click();
                    document.body.removeChild(
                        a
                    );
                    /*
                     * URL解放
                     */
                    URL.revokeObjectURL(
                        pngURL
                    );
                },
                "image/png"
            );
            /*
             * SVG URL解放
             */
            URL.revokeObjectURL(
                svgURL
            );
        };
    /*
     * SVG読み込みエラー
     */
    img.onerror =
        function () {
            URL.revokeObjectURL(
                svgURL
            );
            alert(
                "PNGへの変換に失敗しました。"
            );
        };
    /*
     * SVGを読み込む
     */
    img.src =
        svgURL;
}
/* =========================================
   Ctrl + Enterで生成
========================================= */
document
    .getElementById("textInput")
    .addEventListener(
        "keydown",
        function(event) {
            if (
                event.ctrlKey &&
                event.key === "Enter"
            ) {
                generateSVG();
            }
        }
    );
</script>
</body>
</html>
