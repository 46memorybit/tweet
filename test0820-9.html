<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>100×100 ブロック文字 Generator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px;
    font-family: sans-serif;
    background: #eeeeee;
    color: #222;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
}

h1 {
    font-size: 24px;
    margin-bottom: 10px;
}

.description {
    margin-bottom: 20px;
    line-height: 1.7;
}

textarea {
    width: 100%;
    height: 120px;
    padding: 12px;
    font-size: 20px;
    resize: vertical;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #fff;
}

.controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 12px;
}

button {
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    background: #323639;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    opacity: 0.85;
}

#preview {
    margin-top: 30px;
    padding: 30px;
    overflow-x: auto;
    border-radius: 8px;

    /*
     * 透過部分確認用チェッカーボード
     */
    background:
        linear-gradient(45deg, #ddd 25%, transparent 25%),
        linear-gradient(-45deg, #ddd 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #ddd 75%),
        linear-gradient(-45deg, transparent 75%, #ddd 75%);

    background-size: 20px 20px;

    background-position:
        0 0,
        0 10px,
        10px -10px,
        -10px 0;
}

#preview svg {
    display: block;
    width: 100%;
    height: auto;
}

.legend {
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
    margin-top: 20px;
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
}

.color-box {
    width: 28px;
    height: 28px;
    border: 1px solid #aaa;
}

</style>
</head>

<body>

<div class="container">

    <h1>100×100 ブロック文字 Generator</h1>

    <div class="description">
        1文字を100×100＝10,000ブロックに分割し、<br>
        全ブロックに4色をランダムで割り当てます。<br>
        文字部分は、割り当てられた色が#000000の場合のみ表示し、
        それ以外は透明になります。
    </div>

    <textarea
        id="textInput"
        placeholder="文字を入力してください"
    ></textarea>

    <div class="controls">

        <button onclick="generateSVG()">
            生成
        </button>

        <button onclick="downloadPNG()">
            透過PNGをダウンロード
        </button>

        <button onclick="downloadSVG()">
            透過SVGをダウンロード
        </button>

    </div>

    <div id="preview"></div>

    <div class="legend">

        <div class="legend-item">
            <div
                class="color-box"
                style="background:#323639;"
            ></div>
            <span>#323639</span>
        </div>

        <div class="legend-item">
            <div
                class="color-box"
                style="background:#cfd9de;"
            ></div>
            <span>#cfd9de</span>
        </div>

        <div class="legend-item">
            <div
                class="color-box"
                style="background:#ffffff;"
            ></div>
            <span>#ffffff</span>
        </div>

        <div class="legend-item">
            <div
                class="color-box"
                style="background:#000000;"
            ></div>
            <span>#000000</span>
        </div>

    </div>

</div>


<script>

/* =========================================
   設定
========================================= */


/*
 * 1文字のグリッドサイズ
 *
 * 100 × 100
 * = 10,000ブロック
 */
const GRID_SIZE = 100;


/*
 * 1文字の画像サイズ
 *
 * 100px × 100px
 *
 * 1ブロック = 1px × 1px
 */
const FONT_SIZE = 100;


/*
 * 文字同士の間隔
 */
const LETTER_SPACING = 10;


/*
 * 全ブロックに割り当てる4色
 *
 * すべてのブロックが
 * この4色のいずれかになる
 */
const COLORS = [
    "#323639",
    "#cfd9de",
    "#ffffff",
    "#000000"
];


/*
 * 現在生成されているSVG
 */
let currentSVG = null;


/* =========================================
   ランダムな色を取得
========================================= */

function getRandomColor() {

    return COLORS[
        Math.floor(
            Math.random() * COLORS.length
        )
    ];

}


/* =========================================
   1文字を100×100ブロックに変換
========================================= */

function createCharacter(char, x, y) {

    /*
     * 文字の形を判定するためのCanvas
     */
    const canvas =
        document.createElement("canvas");

    const ctx =
        canvas.getContext("2d");


    canvas.width =
        FONT_SIZE;

    canvas.height =
        FONT_SIZE;


    /*
     * 背景を完全透明にする
     */
    ctx.clearRect(
        0,
        0,
        FONT_SIZE,
        FONT_SIZE
    );


    /*
     * 文字を描画
     */
    ctx.font =
        `bold ${FONT_SIZE}px sans-serif`;

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.fillStyle =
        "#000000";


    ctx.fillText(
        char,
        FONT_SIZE / 2,
        FONT_SIZE / 2
    );


    /*
     * 文字のピクセル情報を取得
     */
    const imageData =
        ctx.getImageData(
            0,
            0,
            FONT_SIZE,
            FONT_SIZE
        );


    const data =
        imageData.data;


    /*
     * SVGのブロック
     */
    let blocks = "";


    /*
     * 100 × 100
     *
     * 合計10,000ブロック
     */
    for (
        let row = 0;
        row < GRID_SIZE;
        row++
    ) {

        for (
            let col = 0;
            col < GRID_SIZE;
            col++
        ) {

            /*
             * 1ブロック = 1px
             */
            const px = col;
            const py = row;


            /*
             * Canvas上のRGBA位置
             */
            const index =
                (py * FONT_SIZE + px) * 4;


            /*
             * 文字の透明度
             */
            const alpha =
                data[index + 3];


            /*
             * =================================
             * 全ブロックに4色をランダム割り当て
             * =================================
             */
            const assignedColor =
                getRandomColor();


            /*
             * =================================
             * 文字部分
             * =================================
             *
             * 文字部分は、
             * 割り当てられた色が
             * #000000の場合のみ表示。
             *
             * #323639
             * #cfd9de
             * #ffffff
             *
             * の場合は透明にする。
             */
            if (alpha > 30) {

                if (
                    assignedColor === "#000000"
                ) {

                    blocks +=
                        `<rect
                            x="${x + col}"
                            y="${y + row}"
                            width="1"
                            height="1"
                            fill="#000000"
                        />`;
                }

            }


            /*
             * =================================
             * 背景部分
             * =================================
             *
             * 背景部分は、
             * 4色すべてをそのまま表示する。
             */
            else {

                blocks +=
                    `<rect
                        x="${x + col}"
                        y="${y + row}"
                        width="1"
                        height="1"
                        fill="${assignedColor}"
                    />`;
            }

        }
    }


    return blocks;
}


/* =========================================
   SVG生成
========================================= */

function generateSVG() {

    /*
     * 入力文字を取得
     */
    const text =
        document.getElementById(
            "textInput"
        ).value;


    if (!text) {

        alert(
            "文字を入力してください。"
        );

        return;
    }


    /*
     * 改行を除去
     */
    const chars =
        [...text].filter(
            char => char !== "\n"
        );


    if (chars.length === 0) {

        alert(
            "文字を入力してください。"
        );

        return;
    }


    /*
     * SVG全体の幅
     */
    const width =
        chars.length *
        (FONT_SIZE + LETTER_SPACING);


    /*
     * SVG全体の高さ
     */
    const height =
        FONT_SIZE;


    /*
     * SVG内部
     */
    let content = "";


    /*
     * すべての文字を処理
     */
    chars.forEach(
        (char, index) => {

            const x =
                index *
                (FONT_SIZE + LETTER_SPACING);

            const y = 0;


            content +=
                createCharacter(
                    char,
                    x,
                    y
                );

        }
    );


    /*
     * SVG生成
     *
     * 背景要素は一切配置しないため、
     * 描画されていない部分は完全透明。
     */
    currentSVG = `
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="${width}"
    height="${height}"
    viewBox="0 0 ${width} ${height}"
>
${content}
</svg>
`.trim();


    /*
     * プレビュー表示
     */
    document.getElementById(
        "preview"
    ).innerHTML =
        currentSVG;
}


/* =========================================
   SVGダウンロード
========================================= */

function downloadSVG() {

    /*
     * 未生成なら生成
     */
    if (!currentSVG) {

        generateSVG();

        if (!currentSVG) {
            return;
        }
    }


    /*
     * SVG Blob
     */
    const blob =
        new Blob(
            [currentSVG],
            {
                type:
                    "image/svg+xml;charset=utf-8"
            }
        );


    /*
     * Blob URL
     */
    const url =
        URL.createObjectURL(blob);


    /*
     * ダウンロード
     */
    const a =
        document.createElement("a");


    a.href =
        url;

    a.download =
        "block-text.svg";


    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);


    /*
     * URL解放
     */
    URL.revokeObjectURL(url);
}


/* =========================================
   透過PNGダウンロード
========================================= */

function downloadPNG() {

    /*
     * 未生成なら生成
     */
    if (!currentSVG) {

        generateSVG();

        if (!currentSVG) {
            return;
        }
    }


    /*
     * SVGをBlob化
     */
    const svgBlob =
        new Blob(
            [currentSVG],
            {
                type:
                    "image/svg+xml;charset=utf-8"
            }
        );


    /*
     * SVG Blob URL
     */
    const svgURL =
        URL.createObjectURL(
            svgBlob
        );


    /*
     * SVGをImageとして読み込む
     */
    const img =
        new Image();


    img.onload =
        function () {

            /*
             * PNG用Canvas
             */
            const canvas =
                document.createElement(
                    "canvas"
                );


            /*
             * SVGと同じサイズ
             */
            canvas.width =
                img.naturalWidth;

            canvas.height =
                img.naturalHeight;


            /*
             * 2Dコンテキスト
             */
            const ctx =
                canvas.getContext(
                    "2d"
                );


            /*
             * Canvas背景は透明のまま
             */
            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            /*
             * SVGを描画
             */
            ctx.drawImage(
                img,
                0,
                0
            );


            /*
             * PNGへ変換
             */
            canvas.toBlob(
                function (blob) {

                    if (!blob) {

                        alert(
                            "PNGの生成に失敗しました。"
                        );

                        return;
                    }


                    /*
                     * PNG Blob URL
                     */
                    const pngURL =
                        URL.createObjectURL(
                            blob
                        );


                    /*
                     * ダウンロードリンク
                     */
                    const a =
                        document.createElement(
                            "a"
                        );


                    a.href =
                        pngURL;

                    a.download =
                        "block-text.png";


                    document.body.appendChild(
                        a
                    );

                    a.click();

                    document.body.removeChild(
                        a
                    );


                    /*
                     * URL解放
                     */
                    URL.revokeObjectURL(
                        pngURL
                    );

                },
                "image/png"
            );


            /*
             * SVG URL解放
             */
            URL.revokeObjectURL(
                svgURL
            );
        };


    /*
     * SVG読み込みエラー
     */
    img.onerror =
        function () {

            URL.revokeObjectURL(
                svgURL
            );

            alert(
                "PNGへの変換に失敗しました。"
            );
        };


    /*
     * SVGを読み込む
     */
    img.src =
        svgURL;
}


/* =========================================
   Enterではなくボタンで生成
========================================= */

document
    .getElementById("textInput")
    .addEventListener(
        "keydown",
        function(event) {

            /*
             * Ctrl + Enterで生成
             */
            if (
                event.ctrlKey &&
                event.key === "Enter"
            ) {

                generateSVG();

            }

        }
    );

</script>

</body>
</html>
